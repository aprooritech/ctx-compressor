[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-compressor-proxy"
version = "1.0.0"
description = "Context-Window Compressor & Local LLM Proxy - OpenAI-compatible middleware for Ollama and OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aprooritech" }]
keywords = [
    "llm", "proxy", "openai", "ollama", "openrouter",
    "context-window", "compression", "fastapi", "middleware",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
hf = ["transformers>=4.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
# Adjust if your GitHub handle differs.
Homepage = "https://github.com/aprooritech/ctx-compressor"
Issues = "https://github.com/aprooritech/ctx-compressor/issues"
Changelog = "https://github.com/aprooritech/ctx-compressor/blob/main/CHANGELOG.md"

[project.scripts]
ccproxy = "main:run"

[tool.setuptools]
packages = ["src", "src.api", "src.compressor", "src.providers", "src.db"]
py-modules = ["main"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["tiktoken.*", "transformers.*", "aiosqlite.*", "respx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
# ASYNC109: the `timeout` parameters are forwarded to httpx, which implements
# them natively - wrapping them in `asyncio.timeout` would be strictly worse.
ignore = ["ASYNC109"]
